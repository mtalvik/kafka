plugins {
    id 'application'
    id 'java'
}

group = 'demo'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

ext {
    // Match the broker on the kafka EC2, same as lessons 14-15. Bump if upgraded.
    kafkaVersion = '4.3.0'
}

dependencies {
    implementation "org.apache.kafka:kafka-streams:${kafkaVersion}"
    implementation 'org.slf4j:slf4j-simple:2.0.13'
}

application {
    mainClass = 'demo.Ex1Transaction'
}

// One named task per example. Run e.g.:  gradle ex3 --no-daemon
//
// Two examples take arguments:
//   ex1 -Peos=true    enable processing.guarantee = exactly_once_v2
//   ex5 -Pport=8081   HTTP port and APPLICATION_SERVER_CONFIG advertised host
def examples = [
        ex1: 'demo.Ex1Transaction',
        ex2: 'demo.Ex2PapiTopology',
        ex3: 'demo.Ex3SensorPunctuate',
        ex4: 'demo.Ex4ProcessInDsl',
        ex5: 'demo.Ex5InteractiveQuery',
]

examples.each { name, cls ->
    tasks.register(name, JavaExec) {
        group = 'application'
        description = "Run ${cls}"
        classpath = sourceSets.main.runtimeClasspath
        mainClass = cls
        systemProperty 'client.properties.path', file('client.properties').absolutePath

        // t3.small runs the broker alongside these JVMs. ex5 starts TWO
        // instances at once, so the heap cap is not optional there - without
        // it the JVM claims a quarter of host RAM and the second instance is
        // killed mid-rebalance. Applied to every task for consistency.
        jvmArgs = ['-Xmx192m']

        if (project.hasProperty('eos')) {
            systemProperty 'eos', project.property('eos')
        }
        if (project.hasProperty('port')) {
            systemProperty 'port', project.property('port')
        }
    }
}
