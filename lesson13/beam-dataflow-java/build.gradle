plugins {
    id 'application'
    id 'java'
}

group = 'demo'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

ext {
    beamVersion = '2.60.0'
}

dependencies {
    implementation "org.apache.beam:beam-sdks-java-core:${beamVersion}"
    runtimeOnly    "org.apache.beam:beam-runners-direct-java:${beamVersion}"
    implementation 'org.slf4j:slf4j-simple:2.0.13'
}

application {
    mainClass = 'demo.Ex1CorePrimitives'
}

// One named task per example. Run e.g.:  gradle ex5
def examples = [
        ex1: 'demo.Ex1CorePrimitives',
        ex2: 'demo.Ex2FixedWindows',
        ex3: 'demo.Ex3SlidingWindows',
        ex4: 'demo.Ex4SessionWindows',
        ex5: 'demo.Ex5WatermarkTriggers',
        ex6: 'demo.Ex6AccumulatingVsDiscarding',
]

examples.each { name, cls ->
    tasks.register(name, JavaExec) {
        group = 'application'
        description = "Run ${cls}"
        classpath = sourceSets.main.runtimeClasspath
        mainClass = cls
    }
}
