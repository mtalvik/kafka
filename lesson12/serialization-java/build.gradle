plugins {
    id 'application'
    id 'java'
}

group = 'demo'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.apache.kafka:kafka-clients:4.0.0'
    implementation 'org.slf4j:slf4j-simple:2.0.13'

    // Serde libraries — all pure jars, no code generation, no protoc.
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'  // JSON
    implementation 'org.apache.avro:avro:1.11.3'                          // Avro (GenericRecord)
    implementation 'com.google.protobuf:protobuf-java:3.25.3'            // Protobuf (DynamicMessage)
}

application {
    mainClass = 'demo.Ex2Json'
}

// One named task per example. Run e.g.:  gradle ex5 --no-daemon
def examples = [
        ex1: 'demo.Ex1RawBytes',
        ex2: 'demo.Ex2Json',
        ex3: 'demo.Ex3Avro',
        ex4: 'demo.Ex4Protobuf',
        ex5: 'demo.Ex5SizeCompare',
        ex6: 'demo.Ex6KeyPartitioning',
        ex7: 'demo.Ex7Evolution',
        ex8: 'demo.Ex8NullTombstone',
]

examples.each { name, cls ->
    tasks.register(name, JavaExec) {
        group = 'application'
        description = "Run ${cls}"
        classpath = sourceSets.main.runtimeClasspath
        mainClass = cls
        systemProperty 'client.properties.path', file('client.properties').absolutePath
    }
}
