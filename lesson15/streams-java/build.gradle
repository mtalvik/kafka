plugins {
    id 'application'
    id 'java'
}

group = 'demo'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

ext {
    // Match the broker on the kafka EC2, same as lesson14. Bump if upgraded.
    kafkaVersion = '4.3.0'
}

dependencies {
    implementation "org.apache.kafka:kafka-streams:${kafkaVersion}"
    implementation 'org.slf4j:slf4j-simple:2.0.13'
}

application {
    mainClass = 'demo.Ex1UpperCase'
}

// One named task per example. Run e.g.:  ./gradlew ex6
def examples = [
        ex1: 'demo.Ex1UpperCase',
        ex2: 'demo.Ex2PurchaseSimple',
        ex3: 'demo.Ex3Purchase',
        ex4: 'demo.Ex4Reward',
        ex5: 'demo.Ex5Join',
        ex6: 'demo.Ex6SessionCount',
]

examples.each { name, cls ->
    tasks.register(name, JavaExec) {
        group = 'application'
        description = "Run ${cls}"
        classpath = sourceSets.main.runtimeClasspath
        mainClass = cls
        systemProperty 'client.properties.path', file('client.properties').absolutePath
    }
}
