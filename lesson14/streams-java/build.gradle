plugins {
    id 'java'
}

repositories {
    mavenCentral()
}

ext {
    // Match the broker on the kafka EC2. Bump if the cluster is upgraded.
    kafkaVersion = '4.3.0'
}

dependencies {
    implementation "org.apache.kafka:kafka-streams:${kafkaVersion}"
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    runtimeOnly 'org.slf4j:slf4j-simple:2.0.13'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

// Record deserialization in Jackson needs component names at runtime.
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-parameters'
}

def exercises = [
        ex1: 'otus.kafka.streams.Ex1KTable',
        ex2: 'otus.kafka.streams.Ex2Aggregation',
        ex3: 'otus.kafka.streams.Ex3Window',
        ex4: 'otus.kafka.streams.Ex4GlobalKTable',
]

exercises.each { name, cls ->
    tasks.register(name, JavaExec) {
        group = 'streams'
        description = "Run ${cls}"
        classpath = sourceSets.main.runtimeClasspath
        mainClass = cls
        // ex1 caching demo: ./gradlew ex1 -Pcache=0
        if (project.hasProperty('cache')) {
            systemProperty 'cache', project.getProperty('cache')
        }
    }
}
