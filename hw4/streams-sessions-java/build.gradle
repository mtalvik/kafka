plugins {
    id 'application'
    id 'java'
}

group = 'demo'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.apache.kafka:kafka-clients:4.0.0'
    implementation 'org.apache.kafka:kafka-streams:4.0.0'
    implementation 'org.slf4j:slf4j-simple:2.0.13'
}

application {
    mainClass = 'demo.Ex1SessionCount'
}

// One named task per example. Run e.g.:  gradle ex1 --no-daemon
// Shorten the session gap while testing:  gradle ex1 --no-daemon -Dgap.minutes=1
def examples = [
        ex1: 'demo.Ex1SessionCount',
        ex2: 'demo.Ex2FinalSessionCount',
]

examples.each { name, cls ->
    tasks.register(name, JavaExec) {
        group = 'application'
        description = "Run ${cls}"
        classpath = sourceSets.main.runtimeClasspath
        mainClass = cls
        systemProperty 'client.properties.path', file('client.properties').absolutePath
        systemProperty 'gap.minutes', System.getProperty('gap.minutes', '5')
        standardInput = System.in
    }
}
